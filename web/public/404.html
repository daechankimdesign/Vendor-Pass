<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VendorPass</title>
    <script>
      // GitHub Pages SPA redirect: encode the path into a query param and
      // redirect to the repo root so index.html can restore it via history.
      // segmentCount=1 for project pages (/Vendor-Pass/); use 0 for user pages.
      var segmentCount = 1;
      var l = window.location;
      var base = l.pathname.split('/').slice(0, 1 + segmentCount).join('/');
      var rest = l.pathname.slice(1).split('/').slice(segmentCount).join('/');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        base + '/?path=/' + rest.replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
